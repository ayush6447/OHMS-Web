<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>OMHS — Toward needle-free cholesterol checks</title>
    <meta
      name="description"
      content="OMHS is a research prototype by Ayuda exploring non-invasive cholesterol estimation with near-infrared light, a pneumatic finger cuff and a companion app for Android and iOS. Not a medical device."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FBFBFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0E2E" media="(prefers-color-scheme: dark)" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / social. TODO: make og:url and og:image absolute once the production domain is known. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OMHS" />
    <meta property="og:title" content="OMHS — Toward needle-free cholesterol checks" />
    <meta
      property="og:description"
      content="A research prototype estimating cholesterol with near-infrared light and a pneumatic cuff, streamed live to an Android and iOS app."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OMHS logo with the headline: Toward needle-free cholesterol checks." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OMHS — Toward needle-free cholesterol checks" />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Apply the saved or system theme before first paint (no flash). -->
    <script>
      (function () {
        var mode;
        try {
          mode = localStorage.getItem('omhs-theme');
        } catch (e) {}
        if (mode !== 'light' && mode !== 'dark') {
          mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (mode === 'dark') document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = mode;
      })();
    </script>
  </head>
  <body>
    <noscript>
      <p style="padding: 24px; font-family: sans-serif">
        OMHS is a research prototype exploring non-invasive cholesterol estimation. Please enable JavaScript to view
        this page. OMHS is not a medical device.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
